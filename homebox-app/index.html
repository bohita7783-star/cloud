<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#F5A13A">
<title>ホームボックス</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* HomeBox v0.1 — design tokens taken from the HomeBox LP v0.1.1 (thick single-weight lines,
   flat fills, hard offset shadows, safety orange, "点検済" stamp red). Work-tool restraint:
   motion only as feedback. System fonts only: the app never loads anything from outside. */
:root{
  --paper:#FFF3DA; --surface:#FFFFFF; --fg:#2B231E; --muted:#6E5F54; --line:#EBD8B4;
  --stroke:#2B231E; --hard:#2B231E; --sun:#FADF8C; --safety:#F5A13A; --safety-text:#A9580A;
  --stamp:#D63A2C; --pipe:#36507F; --sky:#9CCBEA; --mint:#BFE6C4; --custard:#FCEDBE; --ok:#2E7D4F;
  --f:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,"Noto Sans Mono",monospace;
  --bw:3px; --pop:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1D1814; --surface:#2A221C; --fg:#FFF0D6; --muted:#CBB79E; --line:#3D3229;
  --stroke:#F3E1C2; --hard:#000; --sun:#E8CB6E; --safety-text:#FFB65C; --custard:#5A4A22; --ok:#7FD39B; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--fg);font:500 16px/1.6 var(--f);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--safety);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:900}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--stroke);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top svg{width:36px;height:36px;flex:none}
.top b{font-size:18px;font-weight:900}
.top .ver{margin-left:auto;font-size:12px;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.card{background:var(--surface);border:var(--bw) solid var(--stroke);border-radius:22px;padding:16px;display:grid;gap:12px;min-width:0}
.card.flat{border-color:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--safety-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border:var(--bw) solid var(--stroke);border-radius:999px;background:var(--surface);
  font-weight:800;box-shadow:0 4px 0 var(--hard);text-decoration:none;color:var(--fg);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--hard)}
.btn.primary{background:var(--safety);color:#2B231E}
.btn.red{background:var(--stamp);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px;box-shadow:0 3px 0 var(--hard)}
.btn[disabled]{opacity:.45;pointer-events:none}
label.field{display:grid;gap:4px;font-size:14px;font-weight:800;min-width:0}
label.field .req{color:var(--stamp)}
label.field .note{font-weight:500;color:var(--muted);font-size:12px}
input[type=text],input[type=search],input[type=datetime-local],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:44px;padding:8px 12px;border:2px solid var(--stroke);border-radius:14px;background:var(--paper);font-weight:500}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:6px 14px;border:2px solid var(--stroke);border-radius:999px;background:var(--paper);font-weight:800;font-size:14px;cursor:pointer}
.chips input:checked+label{background:var(--sun);color:#2B231E;box-shadow:0 3px 0 var(--hard)}
.chips input:focus-visible+label{outline:3px dashed var(--safety);outline-offset:2px}
.badge{display:inline-block;padding:0 9px;border-radius:999px;border:2px solid var(--stroke);font-size:12px;font-weight:800;line-height:1.7;white-space:nowrap}
.badge.ok{background:var(--mint);color:#2B231E}
.badge.todo{border-style:dashed}
.badge.na{border-color:transparent;background:var(--line);color:var(--muted)}
.badge.prov{border-color:var(--safety);color:var(--safety-text)}
.badge.stamp{border-color:var(--stamp);color:var(--stamp)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--stroke);border-radius:18px;background:var(--surface);text-decoration:none;color:inherit;min-width:0}
.item:active{transform:scale(.99)}
.item .t{font-weight:900}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .arrow{margin-left:auto;font-weight:900;color:var(--muted)}
.schema-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.schema-line:last-child{border-bottom:0}
.schema-archived{opacity:.75}
.meter{height:10px;border-radius:10px;background:var(--line);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--ok)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{display:grid;gap:4px;border:2px solid var(--stroke);border-radius:14px;padding:6px;background:var(--surface);min-width:0;position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--line)}
.ph .n{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere;line-height:1.35}
.ph.sel{outline:4px solid var(--safety);outline-offset:1px}
.ph .order{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:var(--safety);color:#2B231E;border:2px solid #2B231E;display:grid;place-items:center;font-weight:900}
table.ledger{width:100%;border-collapse:collapse;table-layout:fixed}
table.ledger td,table.ledger th{padding:8px 6px;border-bottom:2px solid var(--line);vertical-align:top;text-align:left}
table.ledger th{font-size:13px;width:28%;font-weight:800}
.ledger-wrap{overflow-x:auto}
.ledger .cell{display:grid;gap:6px}
.ledger .cell .row{gap:6px}
.ledger select{min-height:36px;padding:4px 8px;width:auto}
.ledger input{min-height:38px}
.tl{display:grid;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:12px}
.problems{border:var(--bw) solid var(--stamp);border-radius:16px;padding:12px;background:var(--surface)}
.problems li{color:var(--stamp);font-weight:700}
.shutter{width:96px;height:96px;border-radius:50%;border:var(--bw) solid var(--stroke);background:var(--stamp);color:#fff;font-weight:900;font-size:17px;
  box-shadow:0 6px 0 var(--hard),inset 0 0 0 9px var(--surface);display:grid;place-items:center;cursor:pointer}
.shutter:active{transform:translateY(6px);box-shadow:0 0 0 var(--hard),inset 0 0 0 9px var(--surface)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--stroke);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs a{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:800;text-decoration:none;color:var(--muted);border-radius:14px}
.tabs a svg{width:26px;height:26px}
.tabs a[aria-current="page"]{color:var(--fg);background:var(--sun)}
@media (prefers-color-scheme: dark){.tabs a[aria-current="page"]{color:#2B231E}}
.tabs a.shoot{color:#fff}
.tabs a.shoot span.c{width:48px;height:48px;margin-top:-22px;border-radius:50%;background:var(--stamp);border:var(--bw) solid var(--stroke);display:grid;place-items:center;box-shadow:0 4px 0 var(--hard)}
.tabs a.shoot b{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--fg);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:800;transition:transform .3s var(--pop),opacity .2s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:var(--bw) solid var(--stroke);border-radius:22px;background:var(--surface);color:var(--fg);padding:18px;max-width:min(520px,92vw);box-shadow:0 8px 0 var(--hard)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:24px 12px;color:var(--muted)}
.empty svg{width:72px;height:72px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.sec-title{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
details.more summary{cursor:pointer;font-weight:800}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
'use strict';
/* ====================================================================
   HomeBox v0.1 — offline equipment ledger, photos, inspections, incidents.
   Data lives only in this browser (IndexedDB). The only way data leaves is
   a file the user exports: backup ZIP, ledger CSV, or a report package for
   the Field Survey converter (hb-report-package/1).
   ==================================================================== */
const APP_VERSION = '0.2.0';
const DB_NAME = 'homebox', DB_VERSION = 1;
const PKG_SCHEMA = 'hb-report-package/1', BACKUP_SCHEMA = 'hb-backup/1';
const MAX_REPORT_PHOTOS = 3, MAX_TIMELINE = 8;
const KINDS = ['銘板', '全景', '圧力計', '異常箇所', 'その他'];
const CATEGORIES = ['ポンプ', 'ファン・送風機', '発電機', 'ボイラー・熱源', '空調機', '電気設備', '給排水', '消防・防災', 'その他'];
// The official 17-item ledger (HomeBox用17項目テンプレート). Stored by key, so the
// display order or wording can change without losing values.
const FIELDS = [
  { key: 'maker', label: '製造者名' },
  { key: 'equip_no', label: '機器番号' },
  { key: 'serial_no', label: '製造番号' },
  { key: 'made', label: '製造年月日' },
  { key: 'installed', label: '設置年月日' },
  { key: 'location', label: '設置場所' },
  { key: 'kind_mass', label: '種類と質量' },
  { key: 'motor_maker', label: '電動機メーカー' },
  { key: 'motor_kw', label: '電動機出力', unit: 'kW' },
  { key: 'rated_a', label: '定格電流', unit: 'A' },
  { key: 'tank_volume', label: '圧力タンク容量', unit: 'L' },
  { key: 'bore', label: '口径' },
  { key: 'head', label: '揚程', unit: 'm' },
  { key: 'motor_type', label: '電動機形式' },
  { key: 'voltage_class', label: '電圧区分' },
  { key: 'rpm', label: '回転数', unit: 'min⁻¹' },
  { key: 'life', label: '標準耐用年数', unit: '年' },
];
// Extension items (not part of the official 17). Kept from v0.1.0 under the same keys.
const EXTRA_FIELDS = [
  { key: 'model', label: '型式' },
  { key: 'system', label: '系統' },
  { key: 'rated_v', label: '定格電圧', unit: 'V' },
  { key: 'airflow', label: '風量', unit: 'm³/min' },
  { key: 'cycle', label: '点検周期' },
  { key: 'note', label: '備考' },
];
// The constants above are the INITIAL template, not the permanent form definition.
// Settings can add, edit, rearrange and archive fields. The stable key never changes.
const DEFAULT_FIELD_SCHEMA = [...FIELDS.map(f => ({ ...f, extra: false, active: true, aliases: [] })),
  ...EXTRA_FIELDS.map(f => ({ ...f, extra: true, active: true, aliases: [] }))];
const ALL_FIELDS = [...FIELDS, ...EXTRA_FIELDS.map(f => ({ ...f, extra: true }))];
// The official 17 mirror the company ledger (the master). They cannot be hidden,
// renamed, regrouped or reordered on a phone; only extension fields are editable.
const OFFICIAL_FIELDS = DEFAULT_FIELD_SCHEMA.filter(f => !f.extra).map(f => ({ ...f }));
const OFFICIAL_KEYS = new Set(OFFICIAL_FIELDS.map(f => f.key));
const FIELD_SCHEMA_KEY = 'ledger_fields_v1';
const FIELD_FILE_SCHEMA = 'hb-ledger-fields/1';
const MAX_LEDGER_FIELDS = 100;
let fieldSchema = DEFAULT_FIELD_SCHEMA.map(f => ({ ...f }));
let fieldSchemaRevision = 0;
let fieldSchemaHistory = [];
function normFieldName(s) { return String(s ?? '').trim().normalize('NFKC').toLowerCase(); }
function validateFieldSchema(fields) {
  if (!Array.isArray(fields) || fields.length < DEFAULT_FIELD_SCHEMA.length || fields.length > MAX_LEDGER_FIELDS)
    throw Error('台帳項目の定義件数が不正です');
  const keys = new Set(), labels = new Map();
  for (const f of fields) {
    if (!f || typeof f.key !== 'string' || !/^[a-z][a-z0-9_]*$/.test(f.key) || keys.has(f.key))
      throw Error('台帳項目のキーが不正または重複しています');
    keys.add(f.key);
    if (typeof f.label !== 'string' || !f.label.trim() || f.label.length > 60 || /[\r\n]/.test(f.label) ||
        typeof f.unit !== 'undefined' && (typeof f.unit !== 'string' || f.unit.length > 30) ||
        typeof f.active !== 'boolean' || typeof f.extra !== 'boolean' || !Array.isArray(f.aliases || []) ||
        (f.aliases || []).length > 30 || (f.aliases || []).some(a => typeof a !== 'string' || a.length > 60) ||
        (typeof f.rule !== 'undefined' && (typeof f.rule !== 'string' || f.rule.length > 150)))
      throw Error('台帳項目の定義が不正です：' + f.key);
    for (const n of [f.label, ...(f.aliases || [])]) {
      const nkey = normFieldName(n);
      if (!nkey || labels.has(nkey) && labels.get(nkey) !== f.key)
        throw Error('台帳項目名または過去の名前が重複しています：' + n);
      labels.set(nkey, f.key);
    }
  }
  for (const f of DEFAULT_FIELD_SCHEMA) if (!keys.has(f.key))
    throw Error('既存項目の識別子が消されています：' + f.key);
  for (const o of OFFICIAL_FIELDS) {
    const f = fields.find(x => x.key === o.key);
    if (!f.active || f.extra || f.label !== o.label || (f.unit || '') !== (o.unit || ''))
      throw Error('正式17項目は変更・非表示にできません：' + o.label);
  }
  if (fields.filter(f => OFFICIAL_KEYS.has(f.key)).map(f => f.key).join() !== OFFICIAL_FIELDS.map(f => f.key).join())
    throw Error('正式17項目の並び順は変更できません');
  if (fields.some(f => !f.extra && !OFFICIAL_KEYS.has(f.key)))
    throw Error('基本項目は正式17項目だけです。新しい項目は追加項目に入れてください');
  return fields;
}
// Bring a schema written by v0.1.3 (which allowed editing the official 17) back to the rule.
// Values are never touched: only the definitions change.
function normalizeFieldSchema(fields) {
  if (!Array.isArray(fields)) return { fields, changed: false };
  const byKey = new Map(fields.map(f => [f.key, f]));
  const official = OFFICIAL_FIELDS.map(o => {
    const f = byKey.get(o.key) || {};
    const aliases = [...new Set([...(f.aliases || []), ...(f.label && f.label !== o.label ? [f.label] : [])])].filter(a => a !== o.label);
    return { ...o, aliases, ...(f.rule ? { rule: f.rule } : {}) };
  });
  const others = fields.filter(f => f && !OFFICIAL_KEYS.has(f.key)).map(f => ({ ...f, extra: true }));
  const next = [...official, ...others];
  return { fields: next, changed: JSON.stringify(next) !== JSON.stringify(fields) };
}
function applyFieldSchema(fields) {
  validateFieldSchema(fields);
  fieldSchema = fields.map(f => ({ ...f, aliases: [...(f.aliases || [])] }));
  const visible = fieldSchema.filter(f => f.active);
  FIELDS.splice(0, FIELDS.length, ...visible.filter(f => !f.extra));
  EXTRA_FIELDS.splice(0, EXTRA_FIELDS.length, ...visible.filter(f => f.extra));
  ALL_FIELDS.splice(0, ALL_FIELDS.length, ...FIELDS, ...EXTRA_FIELDS);
}
async function loadFieldSchema() {
  const saved = await get('meta', FIELD_SCHEMA_KEY);
  if (saved) {
    if (!saved.v || !Number.isInteger(saved.v.revision)) throw Error('台帳項目の設定が破損しています');
    const norm = normalizeFieldSchema(saved.v.fields);
    fieldSchemaRevision = saved.v.revision;
    fieldSchemaHistory = Array.isArray(saved.v.history) ? saved.v.history.slice(-100) : [];
    if (norm.changed) { await updateFieldSchema(norm.fields, 'migrate:official17-fixed'); return; }
    applyFieldSchema(saved.v.fields);
  } else {
    applyFieldSchema(DEFAULT_FIELD_SCHEMA);
    fieldSchemaRevision = 0;
    fieldSchemaHistory = [];
  }
}
async function updateFieldSchema(next, operation) {
  validateFieldSchema(next);
  const revision = fieldSchemaRevision + 1;

    kase[f.k] = v ?? null;

    '測定数値など': t['測定数値など'] || null, '連絡先・連絡結果': t['連絡先・連絡結果'] || null }));
  const pkg = { schema: PKG_SCHEMA, created_at: nowIso(), app: { name: 'HomeBox', version: APP_VERSION }, case: kase,

/* ---------- report engine (Python converter in Pyodide, in a worker) ---------- */
const TEMPLATE_KEY = 'company_template';
const engine = {
  worker: null, seq: 0, pending: new Map(), warmP: null,
  start() {
    if (this.worker) return;
    this.worker = new Worker('./engine-worker.js');
    this.worker.onmessage = e => {
      const { id, type } = e.data, job = this.pending.get(id);
      if (!job) return;
      if (type === 'progress') return job.onProgress?.(e.data.stage);
      this.pending.delete(id);
      type === 'done' ? job.resolve(e.data) : job.reject(new Error(e.data.message));
    };
    this.worker.onerror = e => { for (const j of this.pending.values()) j.reject(new Error('エンジンが停止しました：' + (e.message || ''))); this.pending.clear(); this.worker = null; this.warmP = null; };
  },
  call(cmd, data = {}, onProgress, transfer = []) {
    this.start();
    const id = ++this.seq;
    return new Promise((resolve, reject) => { this.pending.set(id, { resolve, reject, onProgress }); this.worker.postMessage({ id, cmd, ...data }, transfer); });
  },
  warm(onProgress) { return this.warmP ||= this.call('warm', {}, onProgress).catch(e => { this.warmP = null; throw e; }); },
};
async function templateRecord() { return get('meta', TEMPLATE_KEY); }
function stopwatch(el) {
  const t0 = performance.now(); let stage = '';
  const tick = () => { el.textContent = `${stage}（${((performance.now() - t0) / 1000).toFixed(0)}秒）`; };
  const h = setInterval(tick, 500);
  return { set(s) { stage = s; tick(); }, stop() { clearInterval(h); return (performance.now() - t0) / 1000; } };
}

function renderFieldEditor() {

        ${f.unit ? `<span class="muted small">（${esc(f.unit)}）</span>` : ''}
        ${f.rule ? `<div class="muted small">根拠：${esc(f.rule)}</div>` : ''}
        <div class="muted small mono">保存キー：${esc(f.key)}</div></div>
      <div class="row" style="gap:4px">
        ${OFFICIAL_KEYS.has(f.key) ? '' : f.active ? `<button class="btn small ghost" data-op="up" data-fk="${esc(f.key)}" aria-label="${esc(f.label)}を上へ">↑</button>
        <button class="btn small ghost" data-op="down" data-fk="${esc(f.key)}" aria-label="${esc(f.label)}を下へ">↓</button>
        <button class="btn small" data-op="edit" data-fk="${esc(f.key)}">編集</button>
        <button class="btn small ghost" data-op="archive" data-fk="${esc(f.key)}">削除</button>` :
        `<button class="btn small primary" data-op="restore" data-fk="${esc(f.key)}">復元</button>`}
      </div></div>`).join('')}</div>`;
  root.innerHTML = group(false, '正式17項目（会社の台帳と同じ。変更・削除できません）') + group(true, '追加項目（追加・名前変更・並べ替え・削除・復元ができます）');
  $('#fieldExport').onclick = exportFieldSchemaFile;
  $('#fieldImport').onchange = e => e.target.files[0] && importFieldSchemaFile(e.target.files[0]).finally(() => e.target.value = '');
  $('#fieldAdd').onclick = async () => {
    if (fieldSchema.length >= MAX_LEDGER_FIELDS) return toast('項目の上限は100件です');
    const ok = await ask('新しい台帳項目', `<label class="field">項目名 <span class="req">必須</span><input id="schema-name" type="text" maxlength="60" required placeholder="例：法定点検区分"></label>
      <label class="field">単位（任意）<input id="schema-unit" type="text" maxlength="30" placeholder="例：年、A、kW"></label>
      <label class="field">根拠・規程（任意）<input id="schema-rule" type="text" maxlength="150" placeholder="例：社内基準／省令名と条文"></label>
      <p class="muted small">新しい項目は「追加項目」に入ります。正式17項目は会社の台帳と同じに保ちます。</p>`, '追加する');
    if (!ok) return;
    try {
      const { label, unit } = validateNewField($('#schema-name').value, $('#schema-unit').value);
      const rule = $('#schema-rule').value.trim();
      const item = { key: makeFieldKey(), label, ...(unit ? { unit } : {}), ...(rule ? { rule } : {}), extra: true, active: true, aliases: [] };
      await updateFieldSchema([...fieldSchema, item], 'add:' + item.key);
      toast(`「${label}」を追加しました`); renderFieldEditor();
    } catch (e) { toast(e.message); }
  };
  root.querySelectorAll('[data-op][data-fk]').forEach(b => b.onclick = async () => {

        if (unit) next[i].unit = unit; else delete next[i].unit;
      } else if (op === 'archive') {
        const ok = await ask('項目を削除（非表示）', `<p>「${esc(current.label)}」を画面と通常CSVから外します。</p><p>入力済みの値・確認状況・出典は残り、いつでも復元できます。</p>`, '非表示にする');
        if (!ok) return;
        next[i].active = false;
      } else if (op === 'restore') {
        next[i].active = true;
      } else if (op === 'up' || op === 'down') {
        const direction = op === 'up' ? -1 : 1;
        let j = i + direction;
        while (j >= 0 && j < next.length && (next[j].extra !== current.extra || !next[j].active)) j += direction;
        if (j < 0 || j >= next.length) return toast('これ以上は移動できません');
        const target = next.splice(i, 1)[0]; next.splice(j, 0, target);
      } else return;
      await updateFieldSchema(next, op + ':' + key);
      toast('台帳項目の設定を保存しました'); renderFieldEditor();
    } catch (e) { console.error(e); toast('項目を変更できません：' + e.message); }
  });
}

async function exportFieldSchemaFile() {
  const payload = { schema: FIELD_FILE_SCHEMA, app_version: APP_VERSION,
    exported_at: nowIso(), revision: fieldSchemaRevision, fields: fieldSchema };
  download(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `HB-FIELDS-${ymd()}.json`);
  toast('台帳の項目設定をJSONで書き出しました');
}
async function importFieldSchemaFile(file) {
  try {
    if (file.size > 256 * 1024) throw Error('項目設定ファイルが大きすぎます');
    const config = JSON.parse(await file.text());
    if (config.schema !== FIELD_FILE_SCHEMA) throw Error('ホームボックスの項目定義ではありません');
    const norm = normalizeFieldSchema(config.fields);
    if (norm.changed) toast('正式17項目の変更は取り込まず、会社の台帳どおりに戻しました');
    config.fields = norm.fields;
    validateFieldSchema(config.fields);
    const existing = new Map(fieldSchema.map(f => [f.key, f]));
    const supplied = new Set(config.fields.map(f => f.key));
    // Preserve device-only fields as archived rather than removing stored values.
    const deviceOnly = fieldSchema.filter(f => !supplied.has(f.key)).map(f => ({ ...f, active: false }));
    const next = [...config.fields, ...deviceOnly];
    validateFieldSchema(next); // fail on conflicting stable IDs / historical names
    const newFields = config.fields.filter(f => !existing.has(f.key));
    const changed = config.fields.filter(f => existing.has(f.key) && JSON.stringify(existing.get(f.key)) !== JSON.stringify(f));
    const archived = deviceOnly.filter(f => f.active === false);
    const ok = await ask('台帳項目の定義を取り込みますか？', `<p>新規：${newFields.length}項目／設定変更：${changed.length}項目／この端末だけの項目を保管：${archived.length}項目</p>
      <p class="muted">設備の値・写真・案件はそのまま。CSVの見出しや設備画面の項目順は変わることがあります。</p>`, '定義を取り込む');
    if (!ok) return;
    await updateFieldSchema(next, 'import_json');
    toast('項目設定を取り込みました');renderFieldEditor();
  } catch (e) { console.error(e); toast('項目設定を取り込めません：' + e.message); }
}

async function exportBackup() {
  const stores = {}; for (const s of ['equipment', 'cases', 'records', 'meta']) stores[s] = await all(s);
  stores.meta = stores.meta.filter(m => m.key !== TEMPLATE_KEY); // the approved template is registered again from the admin's files
  const photos = await all('photos'), files = [];
  stores.photos = photos.map(({ blob, ...rest }) => { files.push({ name: `photos/${rest.id}`, data: blob }); return rest; });
  const zip = await makeZip([{ name: 'backup.json', data: JSON.stringify({ schema: BACKUP_SCHEMA, app_version: APP_VERSION, exported_at: nowIso(), ...stores }) }, ...files]);
  download(zip, `HB-BACKUP-${ymd()}-${pad(new Date().getHours())}${pad(new Date().getMinutes())}.zip`);
  toast(`バックアップを書き出しました（写真${photos.length}枚）`);
}
async function restoreBackup(file) {
  // Nothing on this device is touched until the whole backup has been checked.
  let z, b;
  try { z = await readZip(file); b = JSON.parse(new TextDecoder().decode(z.get('backup.json'))); }
  catch (e) { return toast('バックアップを読めません：' + e.message); }
  const problems = [];
  if (!b || b.schema !== BACKUP_SCHEMA) return toast('ホームボックスのバックアップではありません');
  for (const s of ['equipment', 'photos', 'cases', 'records', 'meta']) if (!Array.isArray(b[s])) problems.push(`${s} がありません`);
  if (problems.length) return toast('バックアップが不完全です：' + problems.join('、'));
  const savedSchema = b.meta.find(x => x && x.key === FIELD_SCHEMA_KEY);
  if (savedSchema?.v) savedSchema.v.fields = normalizeFieldSchema(savedSchema.v.fields).fields;
  if (savedSchema) { try { validateFieldSchema(savedSchema.v?.fields); } catch (e) { problems.push('台帳項目の設定が不正です：' + e.message); } }
  const photos = [];
  for (const p of b.photos) {
    const d = z.get('photos/' + p.id);
    if (!d) { problems.push(`写真の画像がありません：${p.name || p.id}`); continue; }
    const h = await sha256(d);
    if (p.sha256 && h && p.sha256 !== h) { problems.push(`写真の中身が違います：${p.name || p.id}`); continue; }
    photos.push({ ...p, sha256: p.sha256 || h, blob: new Blob([d], { type: p.type || 'image/jpeg' }) });
  }
  const ids = s => new Set(b[s].map(x => x.id));
  if (ids('equipment').size !== b.equipment.length || ids('photos').size !== b.photos.length || ids('cases').size !== b.cases.length) problems.push('IDが重複しています');
  const need = [...z.values()].reduce((a, d) => a + d.length, 0);
  try { const est = await navigator.storage?.estimate?.(); if (est && est.quota - est.usage < need * 1.5) problems.push('端末の空き容量が足りません'); } catch (_) { }
  if (problems.length) {
    await ask('このバックアップは復元できません', `<ul>${problems.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="muted">この端末のデータは変更していません。</p>`, '閉じる');
    return;
  }
  const ok = await ask('バックアップから復元しますか？', `<p>設備 ${b.equipment.length}台・写真 ${b.photos.length}枚・案件 ${b.cases.length}件・点検 ${b.records.length}件（${esc(fmt(b.exported_at))} 書き出し）。中身の照合はすべて合格しました。</p>
    <p class="muted">今この端末にあるデータは置き換わります。途中で失敗した場合は、元のデータが残ります。</p>`, '置き換えて復元', true);
  if (!ok) return;
  const keepTemplate = await templateRecord();
  try {
    await new Promise((res, rej) => {
      db().then(d => {
        const tx = d.transaction(['equipment', 'photos', 'cases', 'records', 'meta'], 'readwrite');
        tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('中断しました'));
        for (const s of ['equipment', 'photos', 'cases', 'records', 'meta']) tx.objectStore(s).clear();
        for (const s of ['equipment', 'cases', 'records', 'meta']) for (const v of b[s]) tx.objectStore(s).put(v);
        for (const p of photos) tx.objectStore('photos').put(p);
        if (keepTemplate) tx.objectStore('meta').put(keepTemplate);
      }, rej);
    });
  } catch (e) { return toast('復元できませんでした（元のデータは残っています）：' + e.message); }
  await loadFieldSchema(); toast('復元しました'); location.hash = '#home'; route();
}
async function exportCSV(templateOnly) {
  const head = ['設備ID', '設備名', '分類', '場所の区分', 'QR', ...ALL_FIELDS.map(f => f.label)];
  const rows = templateOnly ? [] : (await all('equipment')).sort((a, b) => a.id.localeCompare(b.id)).map(e => [e.id, e.name, e.category, e.area, e.qr, ...ALL_FIELDS.map(f => e.fields[f.key]?.v || '')]);
  const text = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  download(new Blob([text], { type: 'text/csv' }), templateOnly ? 'HB-LEDGER-TEMPLATE.csv' : `HB-LEDGER-${ymd()}.csv`);
}
async function importCSV(file) {
  const rows = parseCSV(decodeText(await file.arrayBuffer()));
  if (rows.length < 2) return toast('データ行がありません');
  const head = rows[0].map(h => h.trim()), col = n => head.indexOf(n);
  if (col('設備名') < 0) return toast('見出しに「設備名」がありません');
  if (new Set(head).size !== head.length) return toast('CSVの見出しが重複しています');
  const findCols = f => [...new Set([f.label, ...(f.aliases || [])].map(col).filter(i => i >= 0))];
  if (ALL_FIELDS.some(f => findCols(f).length > 1)) return toast('同じ項目の新旧見出しが両方あります。CSVを修正してください');
  const archivedCols = fieldSchema.filter(f => !f.active && [f.label, ...(f.aliases || [])].some(n => col(n) >= 0));
  if (archivedCols.length) {
    await ask('非表示の項目がCSVに含まれています', `<p>設定で項目を復元してから取り込み直してください。古い値を誤って消さないため、読み飛ばしません。</p><p>${archivedCols.map(f => esc(f.label)).join('、')}</p>`, '閉じる');
    return;
  }
  const known = ALL_FIELDS.filter(f => findCols(f).length === 1);
  const allowedHeads = new Set(['設備ID', '設備名', '分類', '場所の区分', 'QR',
    ...fieldSchema.flatMap(f => [f.label, ...(f.aliases || [])])]);
  const unknown = head.filter(h => h && !allowedHeads.has(h));
  if (unknown.length) {
    await ask('未登録のCSV列があります', `<p>読み飛ばしを防ぐため、先に設定で項目を追加してください。</p><p class="mono">${unknown.slice(0, 10).map(esc).join('、')}</p>`, '閉じる');
    return;
  }
  const existing = new Map((await all('equipment')).map(e => [e.id, e]));
  const data = rows.slice(1).map(r => ({ id: (r[col('設備ID')] || '').trim(), name: (r[col('設備名')] || '').trim(), category: (r[col('分類')] || '').trim(), area: (r[col('場所の区分')] || '').trim(), qr: (r[col('QR')] || '').trim(),
    fields: Object.fromEntries(known.map(f => [f.key, (r[findCols(f)[0]] || '').trim()])) })).filter(r => r.name);
  const upd = data.filter(r => existing.has(r.id)).length;
  const ok = await ask('台帳CSVを取り込みますか？', `<p>${data.length}台（新規 ${data.length - upd}・更新 ${upd}）。読めた項目：${known.length}/${ALL_FIELDS.length}（17項目 ${known.filter(f => !f.extra).length}/${FIELDS.length}）</p><p class="muted">取り込んだ値は「未確認」になります。現物や銘板で確かめてから「確認済」にしてください。</p>`, '取り込む');
  if (!ok) return;
  for (const r of data) {
    let eq = existing.get(r.id);
    if (!eq) { eq = await newEquipment(r, r.id); }
    Object.assign(eq, { name: r.name, category: CATEGORIES.includes(r.category) ? r.category : (r.category ? 'その他' : eq.category), area: r.area || eq.area, qr: r.qr || eq.qr, updatedAt: nowIso() });
    for (const [k, v] of Object.entries(r.fields)) if (v) eq.fields[k] = { v, st: 'todo', src: 'CSV取り込み' };
    await put('equipment', eq);
  }
  toast(`${data.length}台を取り込みました`); location.hash = '#eq';
}

/* ---------- router ---------- */
const routes = [
  [/^#?(home)?$/, viewHome], [/^#eq$/, viewEqList], [/^#eq-new$/, () => viewEqForm()], [/^#eq-edit\/(.+)$/, m => viewEqForm(m[1])],
  [/^#eq\/([^/]+)$/, m => viewEq(m[1])], [/^#shoot(?:\/(.*))?$/, m => viewShoot(m[1])], [/^#cases$/, viewCases],
  [/^#case\/(.+)$/, m => viewCase(m[1])], [/^#settings$/, viewSettings],
];
async function route() {
  const h = decodeURIComponent(location.hash || '#home');
  const v = V(); const fresh = v.cloneNode(false); v.replaceWith(fresh); // drop old listeners
  for (const [re, fn] of routes) { const m = h.match(re); if (m) { setTab(h); try { await fn(m); } catch (e) { console.error(e); fresh.innerHTML = `<section class="card problems"><b>エラー</b><p>${esc(e.message)}</p></section>`; } scrollTo(0, 0); return; } }
  location.hash = '#home';
}
addEventListener('hashchange', route);
$('#ver').textContent = 'v' + APP_VERSION;
loadFieldSchema().then(route).catch(e => { console.error(e); V().innerHTML = `<section class="card problems"><b>台帳項目の設定を読み込めません</b><p>${esc(e.message)}</p><p>バックアップから復元する前に管理者へ相談してください。</p></section>`; });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => { });
