<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#F5A13A">
<title>ホームボックス</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* HomeBox v0.1 — design tokens taken from the HomeBox LP v0.1.1 (thick single-weight lines,
   flat fills, hard offset shadows, safety orange, "点検済" stamp red). Work-tool restraint:
   motion only as feedback. System fonts only: the app never loads anything from outside. */
:root{
  --paper:#FFF3DA; --surface:#FFFFFF; --fg:#2B231E; --muted:#6E5F54; --line:#EBD8B4;
  --stroke:#2B231E; --hard:#2B231E; --sun:#FADF8C; --safety:#F5A13A; --safety-text:#A9580A;
  --stamp:#D63A2C; --pipe:#36507F; --sky:#9CCBEA; --mint:#BFE6C4; --custard:#FCEDBE; --ok:#2E7D4F;
  --f:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,"Noto Sans Mono",monospace;
  --bw:3px; --pop:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1D1814; --surface:#2A221C; --fg:#FFF0D6; --muted:#CBB79E; --line:#3D3229;
  --stroke:#F3E1C2; --hard:#000; --sun:#E8CB6E; --safety-text:#FFB65C; --custard:#5A4A22; --ok:#7FD39B; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--fg);font:500 16px/1.6 var(--f);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--safety);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:900}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--stroke);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top svg{width:36px;height:36px;flex:none}
.top b{font-size:18px;font-weight:900}
.top .ver{margin-left:auto;font-size:12px;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.card{background:var(--surface);border:var(--bw) solid var(--stroke);border-radius:22px;padding:16px;display:grid;gap:12px;min-width:0}
.card.flat{border-color:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--safety-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border:var(--bw) solid var(--stroke);border-radius:999px;background:var(--surface);
  font-weight:800;box-shadow:0 4px 0 var(--hard);text-decoration:none;color:var(--fg);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--hard)}
.btn.primary{background:var(--safety);color:#2B231E}
.btn.red{background:var(--stamp);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px;box-shadow:0 3px 0 var(--hard)}
.btn[disabled]{opacity:.45;pointer-events:none}
label.field{display:grid;gap:4px;font-size:14px;font-weight:800;min-width:0}
label.field .req{color:var(--stamp)}
label.field .note{font-weight:500;color:var(--muted);font-size:12px}
input[type=text],input[type=search],input[type=datetime-local],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:44px;padding:8px 12px;border:2px solid var(--stroke);border-radius:14px;background:var(--paper);font-weight:500}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:6px 14px;border:2px solid var(--stroke);border-radius:999px;background:var(--paper);font-weight:800;font-size:14px;cursor:pointer}
.chips input:checked+label{background:var(--sun);color:#2B231E;box-shadow:0 3px 0 var(--hard)}
.chips input:focus-visible+label{outline:3px dashed var(--safety);outline-offset:2px}
.badge{display:inline-block;padding:0 9px;border-radius:999px;border:2px solid var(--stroke);font-size:12px;font-weight:800;line-height:1.7;white-space:nowrap}
.badge.ok{background:var(--mint);color:#2B231E}
.badge.todo{border-style:dashed}
.badge.na{border-color:transparent;background:var(--line);color:var(--muted)}
.badge.prov{border-color:var(--safety);color:var(--safety-text)}
.badge.stamp{border-color:var(--stamp);color:var(--stamp)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--stroke);border-radius:18px;background:var(--surface);text-decoration:none;color:inherit;min-width:0}
.item:active{transform:scale(.99)}
.item .t{font-weight:900}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .arrow{margin-left:auto;font-weight:900;color:var(--muted)}
.meter{height:10px;border-radius:10px;background:var(--line);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--ok)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{display:grid;gap:4px;border:2px solid var(--stroke);border-radius:14px;padding:6px;background:var(--surface);min-width:0;position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--line)}
.ph .n{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere;line-height:1.35}
.ph.sel{outline:4px solid var(--safety);outline-offset:1px}
.ph .order{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:var(--safety);color:#2B231E;border:2px solid #2B231E;display:grid;place-items:center;font-weight:900}
table.ledger{width:100%;border-collapse:collapse;table-layout:fixed}
table.ledger td,table.ledger th{padding:8px 6px;border-bottom:2px solid var(--line);vertical-align:top;text-align:left}
table.ledger th{font-size:13px;width:28%;font-weight:800}
.ledger-wrap{overflow-x:auto}
.ledger .cell{display:grid;gap:6px}
.ledger .cell .row{gap:6px}
.ledger select{min-height:36px;padding:4px 8px;width:auto}
.ledger input{min-height:38px}
.tl{display:grid;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:12px}
.problems{border:var(--bw) solid var(--stamp);border-radius:16px;padding:12px;background:var(--surface)}
.problems li{color:var(--stamp);font-weight:700}
.shutter{width:96px;height:96px;border-radius:50%;border:var(--bw) solid var(--stroke);background:var(--stamp);color:#fff;font-weight:900;font-size:17px;
  box-shadow:0 6px 0 var(--hard),inset 0 0 0 9px var(--surface);display:grid;place-items:center;cursor:pointer}
.shutter:active{transform:translateY(6px);box-shadow:0 0 0 var(--hard),inset 0 0 0 9px var(--surface)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--stroke);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs a{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:800;text-decoration:none;color:var(--muted);border-radius:14px}
.tabs a svg{width:26px;height:26px}
.tabs a[aria-current="page"]{color:var(--fg);background:var(--sun)}
@media (prefers-color-scheme: dark){.tabs a[aria-current="page"]{color:#2B231E}}
.tabs a.shoot{color:#fff}
.tabs a.shoot span.c{width:48px;height:48px;margin-top:-22px;border-radius:50%;background:var(--stamp);border:var(--bw) solid var(--stroke);display:grid;place-items:center;box-shadow:0 4px 0 var(--hard)}
.tabs a.shoot b{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--fg);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:800;transition:transform .3s var(--pop),opacity .2s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:var(--bw) solid var(--stroke);border-radius:22px;background:var(--surface);color:var(--fg);padding:18px;max-width:min(520px,92vw);box-shadow:0 8px 0 var(--hard)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:24px 12px;color:var(--muted)}
.empty svg{width:72px;height:72px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.sec-title{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
details.more summary{cursor:pointer;font-weight:800}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="hako" viewBox="0 0 120 120">
      <g stroke="#2B231E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M47 27v-7q0-7 7-7h12q7 0 7 7v7" fill="none"/>
        <rect x="22" y="38" width="76" height="64" rx="18" fill="#fff"/>
        <rect x="15" y="26" width="90" height="22" rx="11" fill="#FCEDBE"/>
      </g>
      <circle cx="49" cy="68" r="4" fill="#2B231E"/><circle cx="71" cy="68" r="4" fill="#2B231E"/>
      <path d="M55 78q5 5 10 0" fill="none" stroke="#2B231E" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 11h18M9 4h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="13.5" r="3.6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 7l1.5-3h5L16 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>

</svg>

<header class="top">
  <svg aria-hidden="true"><use href="#hako"/></svg>
  <b>ホームボックス</b>
  <span class="ver" id="ver"></span>
</header>
<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="メイン">
  <a href="#home" data-tab="home"><svg aria-hidden="true"><use href="#i-home"/></svg>ホーム</a>
  <a href="#eq" data-tab="eq"><svg aria-hidden="true"><use href="#i-box"/></svg>設備台帳</a>
  <a href="#shoot" data-tab="shoot" class="shoot"><span class="c"><svg aria-hidden="true"><use href="#i-cam"/></svg></span><b>撮る</b></a>
  <a href="#cases" data-tab="cases"><svg aria-hidden="true"><use href="#i-doc"/></svg>異常案件</a>
  <a href="#settings" data-tab="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg>設定</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<dialog id="modal"></dialog>

<script>
'use strict';
/* ====================================================================
   HomeBox v0.1 — offline equipment ledger, photos, inspections, incidents.
   Data lives only in this browser (IndexedDB). The only way data leaves is
   a file the user exports: backup ZIP, ledger CSV, or a report package for
   the Field Survey converter (hb-report-package/1).
   ==================================================================== */
const APP_VERSION = '0.1.0';
const DB_NAME = 'homebox', DB_VERSION = 1;
const PKG_SCHEMA = 'hb-report-package/1', BACKUP_SCHEMA = 'hb-backup/1';
const MAX_REPORT_PHOTOS = 3, MAX_TIMELINE = 8;
const KINDS = ['銘板', '全景', '圧力計', '異常箇所', 'その他'];
const CATEGORIES = ['ポンプ', 'ファン・送風機', '発電機', 'ボイラー・熱源', '空調機', '電気設備', '給排水', '消防・防災', 'その他'];
// 17-item ledger. Items marked prov:true are provisional until the official
// template is confirmed; change them here only (stored by key, not by label).
const FIELDS = [
  { key: 'maker', label: '製造者名' },
  { key: 'model', label: '型式', prov: true },
  { key: 'equip_no', label: '機器番号' },
  { key: 'serial_no', label: '製造番号' },
  { key: 'made', label: '製造年月日' },
  { key: 'installed', label: '設置年月日', prov: true },
  { key: 'location', label: '設置場所' },
  { key: 'system', label: '系統', prov: true },
  { key: 'motor_kw', label: '電動機出力', unit: 'kW' },
  { key: 'rated_a', label: '定格電流', unit: 'A' },
  { key: 'rated_v', label: '定格電圧', unit: 'V', prov: true },
  { key: 'bore', label: '口径' },
  { key: 'head', label: '揚程', unit: 'm' },
  { key: 'airflow', label: '風量', unit: 'm³/min', prov: true },
  { key: 'life', label: '標準耐用年数', unit: '年' },
  { key: 'cycle', label: '点検周期', prov: true },
  { key: 'note', label: '備考', prov: true },
];
const STATUS = { todo: '未確認', ok: '確認済', na: '対象外' };
// Incident form = Field Survey template field names (the converter maps them 1:1).
const CASE_FIELDS = [
  { k: '案件識別番号', t: 'text', g: '基本', un: true },
  { k: '発生日時', t: 'datetime', g: '基本', req: true },
  { k: '件名', t: 'text', g: '基本', req: true },
  { k: '発生区分', t: 'select', g: '基本', opt: ['故障', '事故', '苦情', 'その他'] },
  { k: '職種', t: 'select', g: '基本', opt: ['設備', '建築', '消防・防災', '電気', 'その他'] },
  { k: '対象区分', t: 'select', g: '基本', opt: ['', '設備室', '共用部', 'テナント専有部', '外構・通路', 'その他'], un: true },
  { k: '発生場所', t: 'text', g: '基本', req: true },
  { k: '案件類型', t: 'select', g: '基本', opt: ['漏水', '床・会所蓋破損', '電気設備焼損', '空調不冷', 'その他'] },
  { k: '発見者・報告者', t: 'text', g: '基本' },
  { k: '現場確認を実施', t: 'bool', g: '現場対応' },
  { k: '現場確認開始', t: 'time', g: '現場対応' },
  { k: '現場確認終了', t: 'time', g: '現場対応' },
  { k: '一次対応を実施', t: 'bool', g: '現場対応' },
  { k: '一次対応開始', t: 'time', g: '現場対応' },
  { k: '一次対応終了', t: 'time', g: '現場対応' },
  { k: '状況概要', t: 'area', g: '内容', req: true, tip: '最初に確認した事実だけ。推測は「原因・考察」へ。' },
  { k: '影響範囲', t: 'area', g: '内容', tip: 'テナント営業、給排水、転倒・人身など。影響なしでも記録。' },
  { k: '原因・考察', t: 'area', g: '内容', tip: '確定と推定を分けて書く。' },
  { k: '応急処置', t: 'area', g: '内容' },
  { k: '恒久対策・今後の予定', t: 'area', g: '内容' },
  { k: 'オーナー・テナント報告', t: 'area', g: '報告・連絡', un: true },
  { k: '対応業者への連絡', t: 'area', g: '報告・連絡', un: true },
  { k: '社内報告', t: 'area', g: '報告・連絡', un: true },
  { k: '報告先・提出状況', t: 'area', g: '報告・連絡', un: true },
  { k: '復旧・完了状況', t: 'select', g: '報告・連絡', opt: ['調査中', '応急処置中', '恒久修繕待ち', '復旧済み', '経過観察中', 'その他'], un: true },
];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n, w = 2) => String(n).padStart(w, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const localInput = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function tzSuffix(d = new Date()) { const o = -d.getTimezoneOffset(), a = Math.abs(o); return `${o >= 0 ? '+' : '-'}${pad(a / 60 | 0)}:${pad(a % 60)}`; }
const withTz = v => v ? (v.length === 16 ? v + ':00' : v) + tzSuffix(new Date(v)) : null;
const nowIso = () => withTz(localInput());
function fmt(v) { if (!v) return ''; const d = new Date(v); if (isNaN(d)) return String(v); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const rid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
async function sha256(u8) { if (!(window.crypto && crypto.subtle)) return null; const h = await crypto.subtle.digest('SHA-256', u8); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function ask(title, body, ok = '実行する', danger = false) {
  return new Promise(res => {
    const d = $('#modal');
    d.innerHTML = `<form method="dialog" style="display:grid;gap:14px"><h2 style="font-size:20px">${esc(title)}</h2><div>${body}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="no">やめる</button><button class="btn ${danger ? 'red' : 'primary'}" value="yes">${esc(ok)}</button></div></form>`;
    d.onclose = () => res(d.returnValue === 'yes');
    d.showModal();
  });
}

/* ---------- IndexedDB ---------- */
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('equipment', { keyPath: 'id' });
      const p = d.createObjectStore('photos', { keyPath: 'id' });
      p.createIndex('equipmentId', 'equipmentId'); p.createIndex('caseId', 'caseId');
      d.createObjectStore('cases', { keyPath: 'id' });
      d.createObjectStore('records', { keyPath: 'id' }).createIndex('equipmentId', 'equipmentId');

/* ---------- settings: backup, CSV, storage ---------- */
async function viewSettings() {
  let persisted = false, est = null;
  try { persisted = await navigator.storage?.persisted?.(); est = await navigator.storage?.estimate?.(); } catch (_) { }
  V().innerHTML = `
  <section class="card"><h1 style="font-size:22px">設定・データ</h1>
    <dl class="kv"><dt>保存場所</dt><dd>この端末のブラウザの中だけ（外部へは送信しません）</dd>
    <dt>消されにくい設定</dt><dd>${persisted ? '<span class="badge ok">有効</span>' : '<span class="badge todo">未設定</span> <button class="btn small" id="persist">有効にする</button>'}</dd>
    <dt>使用量</dt><dd>${est ? (est.usage / 1048576).toFixed(1) + ' MB' : '不明'}</dd><dt>版</dt><dd>${APP_VERSION}</dd></dl></section>
  <section class="card"><h2 style="font-size:18px">バックアップ</h2>
    <p class="muted small">機種変更や故障に備えて、定期的に書き出し、会社が認めた保存先に置いてください。写真は元のまま入ります。</p>
    <div class="row"><button class="btn primary" id="bk">バックアップを書き出す</button><label class="btn" for="rs">バックアップから復元</label><input type="file" id="rs" accept=".zip,application/zip" hidden></div></section>
  <section class="card"><h2 style="font-size:18px">設備台帳CSV</h2>
    <p class="muted small">1行目は見出し：設備ID, 設備名, 分類, 場所の区分, QR, ${FIELDS.map(f => esc(f.label)).join(', ')}。Excelで保存したCSV（UTF-8・Shift_JIS）を読めます。取り込んだ値は「未確認」になります。</p>
    <div class="row"><button class="btn" id="csvout">台帳CSVを書き出す</button><button class="btn" id="csvtpl">空のCSVひな形</button><label class="btn primary" for="csvin">台帳CSVを取り込む</label><input type="file" id="csvin" accept=".csv,text/csv" hidden></div></section>
  <section class="card"><h2 style="font-size:18px">17項目の定義</h2>
    <div class="chips">${FIELDS.map(f => `<span class="badge ${f.prov ? 'prov' : ''}">${esc(f.label)}${f.prov ? '（仮）' : ''}</span>`).join('')}</div>
    <p class="muted small">（仮）の項目は、正式な17項目テンプレートで確定します。値は項目のキーで保存しているので、名前を変えてもデータは残ります。</p></section>
  <section class="card"><h2 style="font-size:18px">全データを消す</h2><p class="muted small">先にバックアップを書き出してください。</p><button class="btn red" id="wipe">この端末のデータをすべて消す</button></section>`;
  $('#persist')?.addEventListener('click', async () => { const ok = await navigator.storage.persist(); toast(ok ? '有効にしました' : 'ブラウザに許可されませんでした（ホーム画面に追加すると通りやすくなります）'); viewSettings(); });
  $('#bk').onclick = exportBackup;
  $('#rs').onchange = e => e.target.files[0] && restoreBackup(e.target.files[0]).finally(() => e.target.value = '');
  $('#csvout').onclick = () => exportCSV(false);
  $('#csvtpl').onclick = () => exportCSV(true);
  $('#csvin').onchange = e => e.target.files[0] && importCSV(e.target.files[0]).finally(() => e.target.value = '');
  $('#wipe').onclick = async () => { if (await ask('すべて消しますか？', '<p>設備・写真・案件・点検記録をこの端末から消します。元に戻せません。</p>', 'すべて消す', true)) { for (const s of ['equipment', 'photos', 'cases', 'records', 'meta']) await req((await os(s, 'readwrite')).clear()); toast('消しました'); location.hash = '#home'; } };
}
async function exportBackup() {
  const stores = {}; for (const s of ['equipment', 'cases', 'records', 'meta']) stores[s] = await all(s);
  const photos = await all('photos'), files = [];
  stores.photos = photos.map(({ blob, ...rest }) => { files.push({ name: `photos/${rest.id}`, data: blob }); return rest; });
  const zip = await makeZip([{ name: 'backup.json', data: JSON.stringify({ schema: BACKUP_SCHEMA, app_version: APP_VERSION, exported_at: nowIso(), ...stores }) }, ...files]);
  download(zip, `HB-BACKUP-${ymd()}-${pad(new Date().getHours())}${pad(new Date().getMinutes())}.zip`);
  toast(`バックアップを書き出しました（写真${photos.length}枚）`);
}
async function restoreBackup(file) {
  let z, b;
  try { z = await readZip(file); b = JSON.parse(new TextDecoder().decode(z.get('backup.json'))); } catch (e) { return toast('バックアップを読めません：' + e.message); }
  if (b.schema !== BACKUP_SCHEMA) return toast('ホームボックスのバックアップではありません');
  const missing = b.photos.filter(p => !z.has('photos/' + p.id)).length;
  const ok = await ask('バックアップから復元しますか？', `<p>設備 ${b.equipment.length}台・写真 ${b.photos.length}枚・案件 ${b.cases.length}件・点検 ${b.records.length}件（${esc(fmt(b.exported_at))} 書き出し）</p>
    ${missing ? `<p style="color:var(--stamp)">写真${missing}枚の画像がZIPにありません。</p>` : ''}<p class="muted">今この端末にあるデータは、すべて置き換わります。</p>`, '置き換えて復元', true);
  if (!ok) return;
  for (const s of ['equipment', 'photos', 'cases', 'records', 'meta']) await req((await os(s, 'readwrite')).clear());
  for (const s of ['equipment', 'cases', 'records', 'meta']) for (const v of b[s]) await put(s, v);
  for (const p of b.photos) { const d = z.get('photos/' + p.id); if (d) await put('photos', { ...p, blob: new Blob([d], { type: p.type }) }); }
  toast('復元しました'); location.hash = '#home'; route();
}
async function exportCSV(templateOnly) {
  const head = ['設備ID', '設備名', '分類', '場所の区分', 'QR', ...FIELDS.map(f => f.label)];
  const rows = templateOnly ? [] : (await all('equipment')).sort((a, b) => a.id.localeCompare(b.id)).map(e => [e.id, e.name, e.category, e.area, e.qr, ...FIELDS.map(f => e.fields[f.key]?.v || '')]);
  const text = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  download(new Blob([text], { type: 'text/csv' }), templateOnly ? 'HB-LEDGER-TEMPLATE.csv' : `HB-LEDGER-${ymd()}.csv`);
}
async function importCSV(file) {
  const rows = parseCSV(decodeText(await file.arrayBuffer()));
  if (rows.length < 2) return toast('データ行がありません');
  const head = rows[0].map(h => h.trim()), col = n => head.indexOf(n);
  if (col('設備名') < 0) return toast('見出しに「設備名」がありません');
  const known = FIELDS.filter(f => col(f.label) >= 0), existing = new Map((await all('equipment')).map(e => [e.id, e]));
  const data = rows.slice(1).map(r => ({ id: (r[col('設備ID')] || '').trim(), name: (r[col('設備名')] || '').trim(), category: (r[col('分類')] || '').trim(), area: (r[col('場所の区分')] || '').trim(), qr: (r[col('QR')] || '').trim(),
    fields: Object.fromEntries(known.map(f => [f.key, (r[col(f.label)] || '').trim()])) })).filter(r => r.name);
  const upd = data.filter(r => existing.has(r.id)).length;
  const ok = await ask('台帳CSVを取り込みますか？', `<p>${data.length}台（新規 ${data.length - upd}・更新 ${upd}）。読めた項目：${known.length}/${FIELDS.length}</p><p class="muted">取り込んだ値は「未確認」になります。現物や銘板で確かめてから「確認済」にしてください。</p>`, '取り込む');
  if (!ok) return;
  for (const r of data) {
    let eq = existing.get(r.id);
    if (!eq) { eq = await newEquipment(r, r.id); }
    Object.assign(eq, { name: r.name, category: CATEGORIES.includes(r.category) ? r.category : (r.category ? 'その他' : eq.category), area: r.area || eq.area, qr: r.qr || eq.qr, updatedAt: nowIso() });
    for (const [k, v] of Object.entries(r.fields)) if (v) eq.fields[k] = { v, st: 'todo', src: 'CSV取り込み' };
    await put('equipment', eq);
  }
  toast(`${data.length}台を取り込みました`); location.hash = '#eq';
}

/* ---------- router ---------- */
const routes = [
  [/^#?(home)?$/, viewHome], [/^#eq$/, viewEqList], [/^#eq-new$/, () => viewEqForm()], [/^#eq-edit\/(.+)$/, m => viewEqForm(m[1])],
  [/^#eq\/([^/]+)$/, m => viewEq(m[1])], [/^#shoot(?:\/(.*))?$/, m => viewShoot(m[1])], [/^#cases$/, viewCases],
  [/^#case\/(.+)$/, m => viewCase(m[1])], [/^#settings$/, viewSettings],
];
async function route() {
  const h = decodeURIComponent(location.hash || '#home');
  const v = V(); const fresh = v.cloneNode(false); v.replaceWith(fresh); // drop old listeners
  for (const [re, fn] of routes) { const m = h.match(re); if (m) { setTab(h); try { await fn(m); } catch (e) { console.error(e); fresh.innerHTML = `<section class="card problems"><b>エラー</b><p>${esc(e.message)}</p></section>`; } scrollTo(0, 0); return; } }
  location.hash = '#home';
}
addEventListener('hashchange', route);
$('#ver').textContent = 'v' + APP_VERSION;
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => { });
</script>
</body>
</html>
